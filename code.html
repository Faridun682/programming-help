<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programer Help — Онлайн редактор</title>

    <!-- Monaco Editor loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

    <style>
        /* ---------- Тёмная тема (как VS Code Dark+) ---------- */
        :root {
            --bg: #1e1e1e;
            --side: #252526;
            --act: #333333;
            --title: #3c3c3c;
            --tabbar: #252526;
            --tab: #2d2d2d;
            --tabActive: #1e1e1e;
            --border: #2b2b2b;
            --fg: #cccccc;
            --fgBright: #ffffff;
            --fgDim: #858585;
            --hover: #2a2d2e;
            --sel: #37373d;
            --status: #007acc;
            --accent: #0e639c;
            --accent2: #007fd4;
            --ok: #89d185;
            --err: #f48771;
            --warn: #cca700;
            --toast: #252526;
            --menu: #252526;
        }

        /* ---------- Светлая тема ---------- */
        body.light {
            --bg: #ffffff;
            --side: #f3f3f3;
            --act: #2c2c2c;
            --title: #dddddd;
            --tabbar: #f3f3f3;
            --tab: #ececec;
            --tabActive: #ffffff;
            --border: #e5e5e5;
            --fg: #333333;
            --fgBright: #000000;
            --fgDim: #6e7681;
            --hover: #e8e8e8;
            --sel: #e4e6f1;
            --ok: #2e7d32;
            --err: #c62828;
            --warn: #bf8803;
            --toast: #f3f3f3;
            --menu: #f3f3f3;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            font-size: 13px;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        button { font-family: inherit; }
        [hidden] { display: none !important; }

        /* ---------- Экзамен ---------- */
        #examBar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 6px 12px;
            background: #2d1b4e;
            border-left: 3px solid #a855f7;
            color: #e9d5ff;
        }

        body.light #examBar { background: #f3e8ff; color: #581c87; }

        #examBar .ex-title { font-weight: 700; }
        #exTime { font-family: Consolas, monospace; font-weight: 700; font-size: 15px; }
        #exDots { display: flex; gap: 6px; }

        #exDots span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #a855f7;
        }

        #exDots span.cur { background: #a855f7; }
        #exDots span.ok { background: #22c55e; border-color: #22c55e; }

        #examOverlay {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .ex-card {
            background: var(--side);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 26px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .ex-card h2 { margin: 0 0 6px; font-size: 24px; color: var(--fgBright); }
        .ex-card .ex-sub { color: var(--fgDim); margin-bottom: 14px; }
        .ex-card .ex-row { padding: 5px 0; line-height: 1.5; }
        .ex-card .ex-row.ok { color: var(--ok); }
        .ex-card .ex-row.bad { color: var(--err); }
        .ex-card .ex-gain { margin-top: 10px; font-weight: 700; color: #fbbf24; }
        .ex-card .ex-btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

        body.dragging { user-select: none; }
        body.dragging iframe { pointer-events: none; }

        /* ---------- Верхняя строка ---------- */
        #titlebar {
            height: 30px;
            flex: none;
            background: var(--title);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 6px;
            position: relative;
            user-select: none;
        }

        .logo {
            color: #3794ff;
            font-weight: bold;
            font-family: Consolas, monospace;
            margin-right: 6px;
        }

        .menus { display: flex; }

        .menu-btn {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--fg);
        }

        .menu-btn:hover, .menu-btn.open { background: rgba(128, 128, 128, 0.3); }

        .tb-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: var(--fgDim);
            pointer-events: none;
            white-space: nowrap;
        }

        .tb-right { margin-left: auto; }

        .tb-right a {
            color: var(--fg);
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .tb-right a:hover { background: rgba(128, 128, 128, 0.3); }

        /* ---------- Основная область ---------- */
        #main { flex: 1; display: flex; min-height: 0; position: relative; }

        #activity {
            width: 48px;
            flex: none;
            background: var(--act);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 2px;
        }

        .act {
            width: 48px;
            height: 48px;
            background: none;
            border: none;
            border-left: 2px solid transparent;
            color: #858585;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
        .act:hover { color: #ffffff; }
        .act.active { color: #ffffff; border-left-color: #ffffff; }
        .spacer { flex: 1; }

        /* ---------- Боковая панель ---------- */
        #sidebar {
            width: 260px;
            flex: none;
            background: var(--side);
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .sb-title {
            padding: 10px 20px;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: var(--fgDim);
            text-transform: uppercase;
        }

        .sb-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

        .sec-head {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            cursor: pointer;
            border-top: 1px solid var(--border);
            color: var(--fg);
            user-select: none;
        }

        .sec-head:hover { background: var(--hover); }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px 3px 14px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            user-select: none;
            line-height: 22px;
        }

        .tree-row .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .tree-row:hover { background: var(--hover); }
        .tree-row.active { background: var(--sel); color: var(--fgBright); }
        .tree-row.child { padding-left: 38px; }
        .tree-row .count { color: var(--fgDim); font-size: 11px; }
        .tree-row .done { color: var(--ok); }
        .tree-row .todo { color: var(--fgDim); }
        .tree-row.folder { font-weight: 600; }

        .progress { height: 3px; background: var(--border); margin: 6px 14px 8px; border-radius: 2px; overflow: hidden; }
        #progressFill { height: 100%; width: 0; background: var(--ok); transition: width 0.4s; }

        /* значки файлов */
        .fi {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 16px;
            padding: 0 2px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 800;
            font-family: Consolas, monospace;
            flex: none;
        }

        .fi-html { color: #e44d26; }
        .fi-css { color: #42a5f5; }
        .fi-js { color: #f1c40f; }

        /* ---------- Рабочая область ---------- */
        #workbench { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #top { flex: 1; display: flex; min-height: 0; }

        #editorArea { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

        #tabbar {
            display: flex;
            align-items: stretch;
            background: var(--tabbar);
            height: 35px;
            flex: none;
        }

        #tabs { display: flex; flex: 1; overflow-x: auto; scrollbar-width: none; }

        .tab {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 14px;
            background: var(--tab);
            color: var(--fgDim);
            cursor: pointer;
            border-right: 1px solid var(--border);
            border-top: 1px solid transparent;
            white-space: nowrap;
            user-select: none;
        }

        .tab:hover { color: var(--fg); }
        .tab.active { background: var(--tabActive); color: var(--fgBright); border-top-color: var(--accent2); }

        .tab-actions { display: flex; align-items: center; gap: 2px; padding: 0 8px; }

        .icon-btn {
            background: none;
            border: none;
            color: var(--fg);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .icon-btn:hover { background: rgba(128, 128, 128, 0.3); }
        .icon-btn.run { color: #89d185; }
        .icon-btn.chk { color: #4fc1ff; font-size: 13px; }

        #crumbs {
            height: 22px;
            flex: none;
            display: flex;
            align-items: center;
            padding: 0 14px;
            color: var(--fgDim);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* баннер задания */
        #taskBanner {
            flex: none;
            background: var(--side);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            border-left: 3px solid #fbbf24;
            max-height: 200px;
            overflow-y: auto;
        }

        #tbHead {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            cursor: pointer;
            user-select: none;
        }

        #tbHead .chev { color: var(--fgDim); width: 12px; }
        #tbTitle { font-weight: 700; color: #fbbf24; flex: 1; }
        body.light #tbTitle { color: #b45309; }

        .mini-btn {
            background: var(--tab);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 9px;
            cursor: pointer;
            font-size: 12px;
        }

        .mini-btn:hover { background: var(--hover); }
        .mini-btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }

        #tbText {
            padding: 0 14px 10px 33px;
            white-space: pre-line;
            line-height: 1.55;
            color: var(--fg);
        }

        #tbHint {
            margin: 0 14px 10px 33px;
            padding: 8px 10px;
            background: rgba(204, 167, 0, 0.12);
            border-left: 3px solid var(--warn);
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.5;
        }

        #taskBanner.collapsed #tbText,
        #taskBanner.collapsed #tbHint { display: none; }

        #editorWrap { flex: 1; position: relative; min-height: 80px; }
        #editor { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }

        /* ---------- Предпросмотр ---------- */
        #previewArea {
            width: 42%;
            flex: none;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-left: 1px solid var(--border);
            background: var(--bg);
        }

        .pv-head {
            height: 35px;
            flex: none;
            background: var(--tabbar);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
        }

        .pv-title { color: var(--fgDim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }

        .pv-url {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 10px;
            color: var(--fgDim);
            font-size: 12px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #preview { flex: 1; width: 100%; border: 0; background: #ffffff; }

        iframe.checker {
            position: fixed;
            left: -9999px;
            top: 0;
            width: 800px;
            height: 600px;
            visibility: hidden;
        }

        /* ---------- Разделители ---------- */
        .resizer { flex: none; position: relative; z-index: 5; background: transparent; }
        .resizer.v { width: 5px; margin: 0 -2px; cursor: col-resize; }
        .resizer.h { height: 5px; margin: -2px 0; cursor: row-resize; }
        .resizer:hover, body.dragging .resizer.active { background: var(--accent2); }

        /* ---------- Нижняя панель ---------- */
        #panel {
            height: 175px;
            flex: none;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
            background: var(--bg);
            min-height: 0;
        }

        .panel-head { display: flex; align-items: center; height: 35px; flex: none; padding: 0 8px; }
        .ptabs { display: flex; flex: 1; gap: 4px; }

        .pt {
            padding: 7px 10px 5px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.3px;
            border-bottom: 1px solid transparent;
            color: var(--fgDim);
            user-select: none;
        }

        .pt:hover { color: var(--fg); }
        .pt.active { color: var(--fgBright); border-bottom-color: var(--fg); }

        .badge {
            display: inline-block;
            min-width: 16px;
            margin-left: 5px;
            padding: 0 5px;
            border-radius: 8px;
            background: var(--accent);
            color: #ffffff;
            font-size: 10px;
            text-align: center;
        }

        .panel-body { flex: 1; overflow: auto; padding: 6px 14px 10px; min-height: 0; }

        .p-empty { color: var(--fgDim); padding: 4px 0; }

        .cl { font-family: Consolas, "Courier New", monospace; white-space: pre-wrap; padding: 1px 0; }
        .cl.error { color: var(--err); }
        .cl.warn { color: var(--warn); }

        .prob { display: flex; gap: 8px; padding: 2px 0; cursor: pointer; }
        .prob:hover { background: var(--hover); }
        .prob .src { color: var(--fgDim); }

        .res-title { font-weight: 700; margin-bottom: 6px; font-size: 14px; }
        .res-title.ok { color: var(--ok); }
        .res-title.fail { color: var(--err); }
        .res-list { line-height: 1.8; }
        .res-list .ok { color: var(--ok); }
        .res-list .bad { color: var(--err); }

        .next-btn {
            margin-top: 8px;
            background: #fbbf24;
            color: #1e1e1e;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            cursor: pointer;
        }

        /* ---------- Строка состояния ---------- */
        #statusbar {
            height: 22px;
            flex: none;
            background: var(--status);
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 6px;
            font-size: 12px;
            user-select: none;
        }

        .sb-item { padding: 0 8px; height: 100%; display: flex; align-items: center; cursor: pointer; white-space: nowrap; }
        .sb-item:hover { background: rgba(255, 255, 255, 0.18); }
        .sb-gap { flex: 1; }

        /* ---------- Меню и уведомления ---------- */
        #dropdown {
            position: fixed;
            z-index: 100;
            min-width: 230px;
            background: var(--menu);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            padding: 4px 0;
        }

        .dd-item { display: flex; justify-content: space-between; gap: 24px; padding: 5px 18px; cursor: pointer; color: var(--fg); }
        .dd-item:hover { background: var(--accent); color: #ffffff; }
        .dd-key { color: var(--fgDim); }
        .dd-item:hover .dd-key { color: #dddddd; }
        .dd-sep { height: 1px; background: var(--border); margin: 4px 0; }

        #toasts {
            position: fixed;
            right: 14px;
            bottom: 34px;
            z-index: 90;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .toast {
            background: var(--toast);
            color: var(--fg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent2);
            border-radius: 4px;
            padding: 10px 14px;
            max-width: 360px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            line-height: 1.5;
        }

        .toast.good { border-left-color: var(--ok); }
        .toast button { margin-top: 8px; margin-right: 6px; }

        /* ---------- Телефоны и узкие экраны ---------- */
        @media (max-width: 800px) {
            .tb-title { display: none; }
            #activity { width: 40px; }
            .act { width: 40px; height: 42px; }

            #sidebar {
                position: absolute;
                z-index: 20;
                left: 40px;
                top: 0;
                bottom: 0;
                width: 270px;
                box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
            }

            #top { flex-direction: column; }
            #previewArea { width: 100% !important; height: 240px; flex: none; border-left: 0; border-top: 1px solid var(--border); }
            .resizer.v { display: none; }
            #panel { height: 130px; }
            .menus .menu-btn { padding: 4px 6px; }
            .sb-hide-mobile { display: none; }
        }
    </style>
</head>

<body>

<!-- Верхняя строка с меню -->
<div id="titlebar">
    <span class="logo">&lt;/&gt;</span>
    <div class="menus" id="menus"></div>
    <div class="tb-title" id="titleText">Programer Help</div>
    <div class="tb-right"><a href="lessons.html">← К урокам</a></div>
</div>

<div id="main">

    <!-- Панель значков -->
    <div id="activity">
        <button class="act active" id="actExplorer" title="Проводник (Ctrl+B)">
            <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button class="act" id="actQuests" title="Квесты">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        </button>
        <button class="act" id="actRun" title="Запустить (Ctrl+Enter)">
            <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
        </button>
        <span class="spacer"></span>
        <button class="act" id="actSettings" title="Настройки">⚙</button>
    </div>

    <!-- Боковая панель -->
    <div id="sidebar">
        <div class="sb-title">Проводник</div>
        <div class="sb-scroll">
            <div class="sec-head" id="headFiles"><span id="chevFiles">▾</span> Programer-Help</div>
            <div id="fileList"></div>

            <div class="sec-head" id="headQuests"><span id="chevQuests">▾</span> Квесты</div>
            <div id="questSection">
                <div class="progress"><div id="progressFill"></div></div>
                <div id="questTree"></div>
            </div>
        </div>
    </div>
    <div class="resizer v" id="rzSidebar"></div>

    <!-- Рабочая область -->
    <div id="workbench">

        <div id="top">

            <div id="editorArea">

                <div id="tabbar">
                    <div id="tabs"></div>
                    <div class="tab-actions">
                        <button class="icon-btn chk" id="btnCheck" title="Проверить задание" hidden>✔ Проверить</button>
                        <button class="icon-btn" id="btnShare" title="Поделиться ссылкой на код">🔗</button>
                        <button class="icon-btn run" id="btnRun" title="Запустить (Ctrl+Enter)">▶</button>
                    </div>
                </div>

                <div id="crumbs"></div>

                <div id="examBar" hidden>
                    <span class="ex-title">🎯 Экзамен</span>
                    <span id="exInfo"></span>
                    <span id="exDots"></span>
                    <span id="exTime">20:00</span>
                    <span class="spacer"></span>
                    <button class="mini-btn" id="exSkip">Пропустить →</button>
                    <button class="mini-btn" id="exFinish">Завершить</button>
                </div>

                <div id="taskBanner" hidden>
                    <div id="tbHead">
                        <span class="chev" id="tbChev">▾</span>
                        <span id="tbTitle"></span>
                        <button class="mini-btn" id="tbHintBtn">💡 Подсказка</button>
                        <button class="mini-btn" id="tbResetBtn">↺ Сначала</button>
                        <button class="mini-btn" id="tbBugBtn">🐞 Ошибка?</button>
                    </div>
                    <div id="tbText"></div>
                    <div id="tbHint" hidden></div>
                </div>

                <div id="editorWrap"><div id="editor"></div></div>
            </div>

            <div class="resizer v" id="rzPreview"></div>

            <div id="previewArea">
                <div class="pv-head">
                    <span class="pv-title">Предпросмотр</span>
                    <div class="pv-url" id="pvUrl">http://127.0.0.1:5500/index.html</div>
                    <button class="icon-btn" id="btnRefresh" title="Обновить">⟳</button>
                </div>
                <iframe id="preview" sandbox="allow-scripts"></iframe>
            </div>

        </div>

        <div class="resizer h" id="rzPanel"></div>

        <div id="panel">
            <div class="panel-head">
                <div class="ptabs">
                    <span class="pt" id="pt_problems">ПРОБЛЕМЫ<span class="badge" id="bd_problems" hidden></span></span>
                    <span class="pt active" id="pt_check">ПРОВЕРКА</span>

    function isDone(track, idx) {
        var p = loadJson("ph_progress");
        return Array.isArray(p[track]) && p[track].indexOf(idx) > -1;
    }

    function markDone(track, idx) {
        var p = loadJson("ph_progress");
        if (!Array.isArray(p[track])) p[track] = [];
        var isNew = p[track].indexOf(idx) === -1;
        if (isNew) p[track].push(idx);
        saveJson("ph_progress", p);
        return isNew;
    }

    function toast(message, good, actionLabel, action) {

        var t = document.createElement("div");
        t.className = "toast" + (good ? " good" : "");

        var m = document.createElement("div");
        m.textContent = message;
        t.appendChild(m);

        if (actionLabel) {
            var b = document.createElement("button");
            b.className = "mini-btn primary";
            b.textContent = actionLabel;
            b.onclick = function () { t.remove(); action(); };
            t.appendChild(b);
        }

        var x = document.createElement("button");
        x.className = "mini-btn";
        x.textContent = "Закрыть";
        if (actionLabel) {
            x.onclick = function () { t.remove(); };
            t.appendChild(x);
        }

        $("toasts").appendChild(t);
        setTimeout(function () { t.remove(); }, actionLabel ? 12000 : 3500);
    }

    function closeMenu() {
        $("dropdown").hidden = true;
        document.querySelectorAll(".menu-btn.open").forEach(function (b) { b.classList.remove("open"); });
    }

    function openMenu(anchor, items, side) {

        var m = $("dropdown");
        m.innerHTML = "";

        items.forEach(function (it) {

            if (it === "-") {
                var sep = document.createElement("div");
                sep.className = "dd-sep";
                m.appendChild(sep);
                return;
            }

            var row = document.createElement("div");
            row.className = "dd-item";

            var l = document.createElement("span");
            l.textContent = it.label;
            row.appendChild(l);

            if (it.key) {
                var k = document.createElement("span");
                k.className = "dd-key";
                k.textContent = it.key;
                row.appendChild(k);
            }

            row.onclick = function (e) {
                e.stopPropagation();
                closeMenu();
                it.run();
            };

            m.appendChild(row);
        });

        m.hidden = false;

        var rect = anchor.getBoundingClientRect();

        if (side === "right") {
            m.style.left = rect.right + "px";
            m.style.top = Math.max(30, rect.bottom - m.offsetHeight) + "px";
        } else {
            m.style.left = Math.min(rect.left, window.innerWidth - m.offsetWidth - 6) + "px";
            m.style.top = rect.bottom + "px";
        }
    }

    function makeResizer(el, onMove) {

        el.addEventListener("pointerdown", function (e) {

            e.preventDefault();
            document.body.classList.add("dragging");
            el.classList.add("active");
            el.setPointerCapture(e.pointerId);

            function move(ev) { onMove(ev); }

            function up(ev) {
                document.body.classList.remove("dragging");
                el.classList.remove("active");
                try { el.releasePointerCapture(ev.pointerId); } catch (err) { /* уже отпущен */ }
                el.removeEventListener("pointermove", move);
                el.removeEventListener("pointerup", up);
            }

            el.addEventListener("pointermove", move);
            el.addEventListener("pointerup", up);
        });
    }

    function initResizers() {

        makeResizer($("rzSidebar"), function (e) {
            var w = e.clientX - $("activity").offsetWidth;
            $("sidebar").style.width = Math.max(160, Math.min(520, w)) + "px";
        });

        makeResizer($("rzPreview"), function (e) {
            var rect = $("top").getBoundingClientRect();
            var w = rect.right - e.clientX;
            $("previewArea").style.width = Math.max(180, Math.min(rect.width - 260, w)) + "px";
        });

        makeResizer($("rzPanel"), function (e) {
            var rect = $("workbench").getBoundingClientRect();
            var h = rect.bottom - e.clientY;
            $("panel").style.height = Math.max(70, Math.min(rect.height - 180, h)) + "px";
        });
    }

            var row = makeRow(f.lang === activeFile ? "active" : "", [icon, name], function () { openFile(f.lang); });
            box.appendChild(row);
        });
    }

    function renderQuests() {

        var box = $("questTree");
        box.innerHTML = "";

        var total = 0;
        var done = 0;

        box.appendChild(makeRow(currentDaily ? "active" : "",
            [span("📅"), span("Задача дня" + (PHStats.get().dailyDone ? " ✓" : ""), "lbl")],
            openDaily));

        box.appendChild(makeRow(examMode ? "active" : "",
            [span("🎯"), span("Экзамен (5 задач)", "lbl")],
            startExam));

        box.appendChild(makeRow(currentTask === null && !examMode ? "active" : "",
            [span("✏️"), span("Свободный режим", "lbl")],
            function () { openFree(false); }));

        Object.keys(QUESTS).forEach(function (key) {

            var q = QUESTS[key];
            var d = 0;

            q.tasks.forEach(function (t, i) { if (isDone(key, i)) d++; });

            total += q.tasks.length;
            done += d;

            box.appendChild(makeRow("folder",
                [span(openTracks[key] ? "▾" : "▸"), span(q.icon), span(q.title, "lbl"), span(d + "/" + q.tasks.length, "count")],
                function () { openTracks[key] = !openTracks[key]; renderQuests(); }));

            if (openTracks[key]) {
                q.tasks.forEach(function (t, i) {
                    var finished = isDone(key, i);
                    var active = key === currentTrack && i === currentIdx && currentTask !== null;
                    box.appendChild(makeRow("child" + (active ? " active" : ""),
                        [span(finished ? "✓" : "○", finished ? "done" : "todo"), span((i + 1) + ". " + t.title, "lbl")],
                        function () { openTask(key, i); }));
                });
            }
        });

        $("progressFill").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
        $("sbQuests").textContent = "🎯 " + done + "/" + total;
    }

    function renderTabs() {

        var box = $("tabs");
        box.innerHTML = "";

        FILES.forEach(function (f) {
            var t = document.createElement("div");
            t.className = "tab" + (f.lang === activeFile ? " active" : "");
            t.appendChild(span(f.badge, "fi " + f.cls));
            t.appendChild(span(f.name));
            t.onclick = function () { openFile(f.lang); };
            box.appendChild(t);
        });

        var path = ["Programer Help"];
        if (currentTask) {
            path.push(QUESTS[currentTrack].title);
            path.push("Задание " + (currentIdx + 1));
        }
        path.push(fileInfo(activeFile).name);
        $("crumbs").textContent = path.join("  ›  ");
    }

    function updateStatus() {
        var f = fileInfo(activeFile);
        $("sbLang").textContent = f.label;
        $("sbAuto").textContent = "⚡ Автозапуск: " + (settings.autorun ? "вкл" : "выкл");
        $("titleText").textContent = f.name + " — Programer Help";
        $("pvUrl").textContent = "http://127.0.0.1:5500/index.html";
    }

    function openFile(lang) {

        if (!editor) return;

        if (editor.getModel() === models[activeFile]) {
            viewStates[activeFile] = editor.saveViewState();
        }

        activeFile = lang;
        editor.setModel(models[lang]);

        if (viewStates[lang]) editor.restoreViewState(viewStates[lang]);

        editor.focus();

        renderTabs();
        renderFiles();
        updateStatus();
    }

        models.javascript.setValue(j);

    function renderTaskBanner() {

        var b = $("taskBanner");

            return;
        }

        var q = QUESTS[currentTrack];

        $("tbTitle").textContent = (examMode ? "🎯 Экзамен " + (exam.current + 1) + "/" + exam.picks.length + " · " : "") + (currentDaily ? "📅 Задача дня · " : "") + q.icon + " " + q.title + " · Задание " + (currentIdx + 1) + " из " + q.tasks.length + ". " + currentTask.title;

            return;
        }
        if (!currentTask) {
            toast("Подсказки есть только в заданиях квестов. Выбери задание слева.", false);

        if (!currentTask) return;
        examOpening = examMode;
        openTask(currentTrack, currentIdx, currentDaily);
        examOpening = false;
    }

    function reportBug() {
        var task = "";
        if (currentTask) {
            var q = QUESTS[currentTrack];
            task = q.title + ", задание " + (currentIdx + 1) + ": " + currentTask.title;
        }
        window.location.href = "contacts.html?bug=1&from=" + encodeURIComponent("Редактор кода") +

    function setCheckMessage(text) {
        var box = $("p_check");
        box.innerHTML = "";
        var d = document.createElement("div");
        d.className = "p-empty";
        d.textContent = text;
        box.appendChild(d);
    }

    function openTask(track, idx, isDaily) {

        if (examBlocked()) return;

        var q = QUESTS[track];
        var t = q && q.tasks[idx];

        if (!t || !editor) return;

        currentTrack = track;
        currentIdx = idx;
        currentTask = t;
        currentDaily = !!isDaily;
        openTracks[track] = true;

        setModels(t.html || "", t.css || "", t.js || "");

        renderTaskBanner();
        setCheckMessage("Напиши решение и нажми «✔ Проверить».");
        openFile(t.tab || q.tab);
        runCode();
        renderQuests();
    }

    function openFree(fresh) {

        if (examBlocked()) return;

        currentTrack = null;
        currentTask = null;
        currentDaily = false;
        skipSave = false;

        var saved = fresh ? {} : loadJson("ph_free");

        var defaultHtml = [
            "<!DOCTYPE html>",
            '<html lang="ru">',
            "<head>",
            '    <meta charset="UTF-8">',
            "    <title>Мой сайт</title>",
            "<\/head>",
            "<body>",
            "",
            "    <h1>Привет, мир!</h1>",
            "",
            "<\/body>",
            "<\/html>"
        ].join("\n");

        setModels(
            typeof saved.html === "string" ? saved.html : defaultHtml,
            typeof saved.css === "string" ? saved.css : "body {\n    font-family: Arial;\n}",
            typeof saved.javascript === "string" ? saved.javascript : 'console.log("Привет, мир!");'
        );

        renderTaskBanner();

    function scheduleSaveFree() {
        if (currentTask || skipSave) return;

        saveTimer = setTimeout(saveFree, 500);

        if (currentTask) return;
        saveJson("ph_free", { html: getCode("html"), css: getCode("css"), javascript: getCode("javascript") });

    function saveAll() {
        saveFree();
        runCode();
        toast("Файлы сохранены и запущены", true);

    // ---------- Очки, серия дней и значки (тот же код, что в stats.js) ----------
    // stats.js — очки опыта (XP), серия дней, значки и профиль ученика
    (function (root) {

        var KEY = "ph_stats";
        var TOTALS = { html: 5, css: 5, js: 5, algo: 8, func: 8, proj: 8 };
        var TRACK_BADGE = { html: "b_html", css: "b_css", js: "b_js", algo: "b_algo", func: "b_func", proj: "b_proj" };

        var BADGES = {
            first:   { icon: "🌱", title: "Первый шаг", text: "Выполнено первое задание" },
            ten:     { icon: "🔟", title: "Десятка", text: "Выполнено 10 заданий" },
            all:     { icon: "🏆", title: "Легенда", text: "Пройдены все задания" },
            b_html:  { icon: "🌐", title: "Мастер HTML", text: "Пройден квест HTML" },
            b_css:   { icon: "🎨", title: "Мастер CSS", text: "Пройден квест CSS" },
            b_js:    { icon: "⚡", title: "Мастер JavaScript", text: "Пройден квест JavaScript" },
            b_algo:  { icon: "🧮", title: "Алгоритмист", text: "Решены все задачи" },
            b_func:  { icon: "🔧", title: "Мастер функций", text: "Пройден квест «Функции»" },
            b_proj:  { icon: "🏗", title: "Строитель", text: "Пройден квест «Проекты»" },
            exam:    { icon: "🎯", title: "Отличник", text: "Сдал экзамен без единой ошибки" },
            streak3: { icon: "🔥", title: "3 дня подряд", text: "Занимался 3 дня подряд" },
            streak7: { icon: "🚀", title: "Неделя подряд", text: "Занимался 7 дней подряд" },
            daily:   { icon: "📅", title: "Задача дня", text: "Решил задачу дня" },
            quiz:    { icon: "🧠", title: "Умник", text: "Ответил на все вопросы квиза правильно" }
        };

        function pad(n) { return n < 10 ? "0" + n : "" + n; }

        function today() {
            var d = new Date();
            return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        }

        function dayNum(str) {
            var p = str.split("-");
            return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
        }

        function read() {
            var s = null;
            try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
            return Object.assign({ xp: 0, streak: 0, last: "", badges: [], dailyDone: "", quiz: {} }, s || {});
        }

        function write(s) {
            try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
        }

        function readProgress() {
            try { return JSON.parse(localStorage.getItem("ph_progress") || "{}") || {}; } catch (e) { return {}; }
        }

        // считаем занятие: продлеваем серию дней
        function touch(s) {
            var t = today();
            if (s.last === t) return;
            if (s.last && dayNum(t) - dayNum(s.last) === 1) s.streak = (s.streak || 0) + 1;
            else s.streak = 1;
            s.last = t;
        }

        function award(s, id, fresh) {
            if (s.badges.indexOf(id) === -1) {
                s.badges.push(id);
                fresh.push(id);
            }
        }

        function counts() {
            var p = readProgress();
            var per = {};
            var total = 0;
            var all = 0;
            Object.keys(TOTALS).forEach(function (k) {
                var d = Math.min(Array.isArray(p[k]) ? p[k].length : 0, TOTALS[k]);
                per[k] = d;
                total += d;
                all += TOTALS[k];
            });
            return { per: per, total: total, all: all };
        }

        function level(xp) { return Math.floor(xp / 100) + 1; }

        function streakNow(s) {
            if (!s.last) return 0;
            return dayNum(today()) - dayNum(s.last) <= 1 ? s.streak : 0;
        }

        function checkBadges(s, fresh, track) {
            var c = counts();
            if (c.total >= 1) award(s, "first", fresh);
            if (c.total >= 10) award(s, "ten", fresh);
            if (track && TRACK_BADGE[track] && c.per[track] >= TOTALS[track]) award(s, TRACK_BADGE[track], fresh);
            if (c.total >= c.all) award(s, "all", fresh);
            if (s.streak >= 3) award(s, "streak3", fresh);
            if (s.streak >= 7) award(s, "streak7", fresh);
        }

        // вызывается, когда задание пройдено
        function onTaskDone(track, isNew, daily) {
            var s = read();
            var fresh = [];
            var gained = 0;

            touch(s);

            if (isNew) gained += (track === "algo" || track === "func") ? 20 : 10;

            if (daily && s.dailyDone !== today()) {
                gained += 15;
                s.dailyDone = today();
                award(s, "daily", fresh);
            }

            s.xp += gained;
            checkBadges(s, fresh, track);
            write(s);

            return { xp: gained, badges: fresh, streak: s.streak, level: level(s.xp) };
        }

        // вызывается, когда пройден квиз
        function onQuiz(id, score, total) {
            var s = read();
            var fresh = [];
            var gained = 0;

            touch(s);

            var prev = s.quiz[id] || 0;
            if (score > prev) {
                gained = (score - prev) * 2;
                s.quiz[id] = score;
            }

            s.xp += gained;
            if (score === total) award(s, "quiz", fresh);
            checkBadges(s, fresh, null);
            write(s);

            return { xp: gained, badges: fresh, streak: s.streak, level: level(s.xp) };
        }

        // вызывается, когда экзамен завершён
        function onExam(score, total) {
            var s = read();
            var fresh = [];

            touch(s);

            var gained = score * 5;
            s.xp += gained;

            if (score === total) award(s, "exam", fresh);
            checkBadges(s, fresh, null);
            write(s);

            return { xp: gained, badges: fresh, streak: s.streak, level: level(s.xp) };
        }

        function get() {
            var s = read();
            return {
                xp: s.xp,
                level: level(s.xp),
                inLevel: s.xp % 100,
                streak: streakNow(s),
                badges: s.badges,
                dailyDone: s.dailyDone === today(),
                quiz: s.quiz
            };
        }

        function el(tag, css, text) {
            var e = document.createElement(tag);
            if (css) e.style.cssText = css;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        // профиль ученика (на странице уроков)
        function renderProfile(box) {

            var g = get();
            box.innerHTML = "";
            box.style.cssText = "background:#fff;border-radius:12px;box-shadow:0 2px 10px #00000010;padding:20px;margin:0 0 30px;text-align:left";

            var top = el("div", "display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between");

            var left = el("div", "flex:1;min-width:220px");
            left.appendChild(el("div", "font-size:20px;font-weight:bold;color:#0f172a", "🎖 Уровень " + g.level));

            var bar = el("div", "height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:8px 0 4px");
            bar.appendChild(el("div", "height:100%;background:#2563eb;width:" + g.inLevel + "%"));
            left.appendChild(bar);
            left.appendChild(el("div", "font-size:13px;color:#64748b", "Опыт: " + g.xp + " XP · до следующего уровня " + (100 - g.inLevel)));
            top.appendChild(left);

            top.appendChild(el("div", "font-size:18px;font-weight:bold;color:#ea580c", "🔥 Серия: " + g.streak + " дн."));

            var daily = el("a", "display:inline-block;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:bold;color:#fff;background:" + (g.dailyDone ? "#16a34a" : "#2563eb"),
                g.dailyDone ? "✅ Задача дня решена" : "📅 Решить задачу дня");
            daily.href = "code.html?daily=1";
            top.appendChild(daily);

            box.appendChild(top);

            var names = Object.keys(BADGES);
            var got = names.filter(function (k) { return g.badges.indexOf(k) > -1; }).length;

            box.appendChild(el("div", "margin:16px 0 8px;font-size:13px;color:#64748b", "Значки: " + got + " из " + names.length));

            var row = el("div", "display:flex;flex-wrap:wrap;gap:10px");

            names.forEach(function (k) {
                var has = g.badges.indexOf(k) > -1;
                var b = el("span", "font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f1f5f9;" + (has ? "" : "filter:grayscale(1);opacity:.3"), BADGES[k].icon);
                b.title = BADGES[k].title + ": " + BADGES[k].text + (has ? "" : " (ещё не получен)");
                row.appendChild(b);
            });

            box.appendChild(row);
        }

        // карточки, которые добавляются на страницу уроков
        var TRACK_CARDS = [
            { key: "algo", title: "Задачи 🧮", text: "Олимпиадные задачи на условия: напиши функцию, а сайт проверит её по тестам.", href: "code.html?track=algo&task=1", btn: "Решать задачи" },
            { key: "func", title: "Функции 🔧", text: "Учись писать свои функции: от квадрата числа до чисел Фибоначчи.", href: "code.html?track=func&task=1", btn: "Начать" },
            { key: "proj", title: "Проекты 🏗", text: "Собери настоящие мини-сайты шаг за шагом: сайт-визитку и список дел.", href: "code.html?track=proj&task=1", btn: "Строить проекты" }
        ];

        function findCard(box, prefix) {
            var cards = box.querySelectorAll(".card");
            for (var i = 0; i < cards.length; i++) {
                var h = cards[i].querySelector("h2");
                if (h && h.textContent.trim().indexOf(prefix) === 0) return cards[i];
            }
            return null;
        }

        function makeCard(title, text, href, btn) {
            var card = el("div");
            card.className = "card";
            card.appendChild(el("h2", "", title));
            card.appendChild(el("p", "", text));
            var a = el("a", "", btn);
            a.href = href;
            card.appendChild(a);
            return card;
        }

        function addBar(card, key) {

            if (/Выполнено:|Пройдено:/.test(card.textContent)) return;

            var d = Math.min(counts().per[key], TOTALS[key]);
            var total = TOTALS[key];

            var wrap = el("div", "margin:0 0 18px");
            wrap.appendChild(el("div", "font-size:13px;color:#64748b;margin-bottom:6px",
                (d === total ? "✅ Пройдено: " : "Выполнено: ") + d + " из " + total));

            var bar = el("div", "height:8px;background:#e2e8f0;border-radius:5px;overflow:hidden");
            bar.appendChild(el("div", "height:100%;background:#22c55e;width:" + Math.round(d / total * 100) + "%"));
            wrap.appendChild(bar);

            card.insertBefore(wrap, card.querySelector("a"));
        }

        // дополнения на странице уроков: полоски прогресса, новые карточки, сертификаты
        function addExtras() {

            var box = document.querySelector(".cards");
            if (!box || box.getAttribute("data-ph-extras")) return;
            box.setAttribute("data-ph-extras", "1");

            var byTitle = { "HTML": "html", "CSS": "css", "JavaScript": "js" };

            box.querySelectorAll(".card").forEach(function (card) {
                var h = card.querySelector("h2");
                var key = h && byTitle[h.textContent.trim()];
                if (key) addBar(card, key);
            });

            TRACK_CARDS.forEach(function (c) {
                var card = findCard(box, c.title.split(" ")[0]);
                if (!card) {
                    card = makeCard(c.title, c.text, c.href, c.btn);
                    box.appendChild(card);
                }
                addBar(card, c.key);
            });

            if (!findCard(box, "Экзамен")) {
                box.appendChild(makeCard("Экзамен 🎯", "5 случайных задач за 20 минут без подсказок. Проверь, чему ты научился.", "code.html?exam=1", "Начать экзамен"));

            }

            // сертификаты у пройденных квестов
            var c = counts();
            var keyByPrefix = { "HTML": "html", "CSS": "css", "JavaScript": "js", "Задачи": "algo", "Функции": "func", "Проекты": "proj" };

            box.querySelectorAll(".card").forEach(function (card) {

                    a.href = "certificate.html?track=" + key;
                    wrap.appendChild(a);
                    card.appendChild(wrap);
                }
            });

            // общий итог под профилем
            if (!/Всего выполнено/.test(document.body.textContent)) {
                var total = 0;
                var sum = 0;
                Object.keys(TOTALS).forEach(function (k) { total += TOTALS[k]; sum += c.per[k]; });

                var line = el("div", "margin:-15px 0 30px;font-weight:bold;color:#2563eb", "Всего выполнено: " + sum + " из " + total);
                box.parentNode.insertBefore(line, box);
            }
        }

        function init() {

    function updateStatsBar() {
        var g = PHStats.get();
        $("sbStats").textContent = "🔥 " + g.streak + "  ⭐ " + g.xp + " XP · ур. " + g.level;
    }

    function announceGain(gain) {
        if (gain.xp > 0) toast("+" + gain.xp + " XP ⭐", true);
        gain.badges.forEach(function (k) {
            var b = PHStats.BADGES[k];
            toast("🏅 Новый значок: " + b.icon + " " + b.title + " — " + b.text, true);
        });
    }

    // Задача дня: у всех учеников в один день одна и та же задача из квестов «Задачи» и «Функции»
    function dailyPick() {
        var pool = [];
        ["algo", "func"].forEach(function (k) {
            QUESTS[k].tasks.forEach(function (t, i) { pool.push([k, i]); });
        });
        var p = PHStats.today().split("-");
        var dayNumber = Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
        return pool[dayNumber % pool.length];
    }

    function openDaily() {
        if (examBlocked()) return;
        var pick = dailyPick();
        openTask(pick[0], pick[1], true);
    }

    // ---------- Экзамен: 5 случайных задач за 20 минут без подсказок ----------

    const EXAM_SECONDS = 20 * 60;

    function pad2(n) { return n < 10 ? "0" + n : "" + n; }

    function fmtTime(sec) {
        sec = Math.max(0, sec);
        return pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60);
    }

    function examBlocked() {
        if (examMode && !examOpening) {
            toast("Идёт экзамен. Сначала заверши его кнопкой «Завершить» над редактором.", false);
            return true;
        }
        return false;
    }

    function examLeft() {
        return Math.round((exam.endsAt - Date.now()) / 1000);
    }

    function renderExamBar() {

        if (!examMode) return;

        $("exInfo").textContent = "Задача " + (exam.current + 1) + " из " + exam.picks.length;
        $("exSkip").textContent = exam.current >= exam.picks.length - 1 ? "Закончить" : "Пропустить →";

        var dots = $("exDots");
        dots.innerHTML = "";

        exam.picks.forEach(function (p, i) {
            var d = document.createElement("span");
            d.className = exam.passed[i] ? "ok" : i === exam.current ? "cur" : "";
            dots.appendChild(d);
        });

        var t = fmtTime(examLeft());
        $("exTime").textContent = "⏱ " + t;
        $("sbExam").textContent = "⏱ " + t;
    }

    function examTick() {
        if (!examMode) return;
        if (examLeft() <= 0) { finishExam(true); return; }
        renderExamBar();
    }

    function examOpenTask(i) {
        exam.current = i;
        examOpening = true;
        openTask(exam.picks[i][0], exam.picks[i][1]);
        examOpening = false;
        renderExamBar();
    }

    function startExam() {

        if (!editor) return;

        if (examMode) {
            toast("Экзамен уже идёт.", false);
            return;
        }

        var picks = [];

        ["html", "css", "js", "algo", "func"].forEach(function (k) {
            picks.push([k, Math.floor(Math.random() * QUESTS[k].tasks.length)]);
        });

        exam = {
            picks: picks,
            current: 0,
            passed: picks.map(function () { return false; }),
            endsAt: Date.now() + EXAM_SECONDS * 1000,
            timer: null
        };

        examMode = true;

        $("examBar").hidden = false;
        $("sbExam").hidden = false;
        $("tbHintBtn").hidden = true;

        exam.timer = setInterval(examTick, 1000);

        toast("Экзамен начался: 5 задач, 20 минут. Подсказки отключены. Удачи! 🍀", true);
        examOpenTask(0);
    }

    function examOnPass() {
        exam.passed[exam.current] = true;
        renderExamBar();
    }

    function examNext() {
        if (!examMode) return;
        if (exam.current < exam.picks.length - 1) examOpenTask(exam.current + 1);
        else finishExam(false);
    }

    function finishExam(timeUp) {

        if (!examMode) return;

        clearInterval(exam.timer);

        var picks = exam.picks;
        var passed = exam.passed;
        var score = passed.filter(Boolean).length;
        var used = EXAM_SECONDS - Math.max(0, examLeft());
        var gain = PHStats.onExam(score, picks.length);

        examMode = false;
        exam = null;

        $("examBar").hidden = true;
        $("sbExam").hidden = true;
        $("tbHintBtn").hidden = false;

        updateStatsBar();
        showExamResult(picks, passed, score, used, gain, timeUp);
    }

    function showExamResult(picks, passed, score, used, gain, timeUp) {

        var card = $("examCard");
        card.innerHTML = "";

        var perfect = score === picks.length;

        var h = document.createElement("h2");
        h.textContent = (perfect ? "🏆 " : score >= 3 ? "👍 " : "💪 ") + "Результат: " + score + " из " + picks.length;
        card.appendChild(h);

        var sub = document.createElement("div");
        sub.className = "ex-sub";
        sub.textContent = (timeUp ? "Время вышло. " : "") + "Затрачено: " + fmtTime(used);
        card.appendChild(sub);

        picks.forEach(function (p, i) {
            var q = QUESTS[p[0]];
            var row = document.createElement("div");
            row.className = "ex-row " + (passed[i] ? "ok" : "bad");
            row.textContent = (passed[i] ? "✓ " : "✗ ") + q.title + ": " + q.tasks[p[1]].title;
            card.appendChild(row);
        });

        var extra = [];
        if (gain.xp > 0) extra.push("+" + gain.xp + " XP ⭐");
        gain.badges.forEach(function (k) {
            var b = PHStats.BADGES[k];
            extra.push("🏅 Новый значок: " + b.icon + " " + b.title);
        });

        if (extra.length) {
            var g = document.createElement("div");
            g.className = "ex-gain";
            g.innerHTML = "";
            extra.forEach(function (t) {
                var line = document.createElement("div");
                line.textContent = t;
                g.appendChild(line);
            });
            card.appendChild(g);
        }

        var btns = document.createElement("div");
        btns.className = "ex-btns";

        var again = document.createElement("button");
        again.className = "mini-btn primary";
        again.textContent = "Ещё раз";
        again.onclick = function () { $("examOverlay").hidden = true; openFree(false); startExam(); };

        var close = document.createElement("button");
        close.className = "mini-btn";
        close.textContent = "Закрыть";
        close.onclick = function () { $("examOverlay").hidden = true; openFree(false); };

        btns.appendChild(again);
        btns.appendChild(close);
        card.appendChild(btns);

        $("examOverlay").hidden = false;
    }

    // ---------- Ссылка «Поделиться кодом» ----------

    function encodeShare(obj) {
        var bytes = new TextEncoder().encode(JSON.stringify(obj));
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return encodeURIComponent(btoa(bin));
    }

    function decodeShare(raw) {
        try {
            var bin = atob(String(raw).replace(/ /g, "+"));
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return JSON.parse(new TextDecoder().decode(bytes));
        } catch (e) {
            return null;
        }
    }

    function copyText(text, done) {

        function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            ta.remove();
            done(ok);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
        } else {
            fallback();
        }
    }

    function shareLink() {

        var base = window.location.href.split("?")[0].split("#")[0];

        var url = base + "?code=" + encodeShare({
            h: getCode("html"),
            c: getCode("css"),
            j: getCode("javascript")
        }) + "&tab=" + activeFile;

        if (url.length > 8000) {
            toast("Код слишком длинный для ссылки. Скачай его через меню «Файл → Скачать index.html».", false);
            return;
        }

        copyText(url, function (ok) {
            toast(ok ? "Ссылка скопирована! Отправь её другу или учителю." : "Не удалось скопировать автоматически. Ссылка: " + url, ok);
        });
    }

    function openShared(raw, tab) {

        if (examBlocked()) return;

        var data = decodeShare(raw);

        if (!data) {
            toast("Не удалось открыть код по ссылке. Открыт свободный режим.", false);
            openFree(false);
            return;
        }

        currentTrack = null;
        currentTask = null;
        currentDaily = false;
        skipSave = true;

        setModels(data.h || "", data.c || "", data.j || "");

        renderTaskBanner();
        setCheckMessage("Открыт код по ссылке. Меняй его и смотри результат. Твой свободный проект не затронут.");
        openFile(tab === "css" || tab === "javascript" ? tab : "html");
        runCode();
        renderQuests();

        toast("Открыт пример по ссылке. Меняй код и смотри результат!", true);
    }

    function downloadHtml() {
        var blob = new Blob([buildDocument(null, true)], { type: "text/html" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "index.html";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }

    function refreshProblems() {

        if (!window.monaco) return;

        var box = $("p_problems");
        box.innerHTML = "";

        FILES.forEach(function (f) {

    // ------------------------------------------------------------
    //  Запуск кода и предпросмотр
    // ------------------------------------------------------------

    const CONSOLE_HOOK =
        "(function(){" +
        "function fmt(a){return Array.prototype.map.call(a,function(x){try{return (typeof x==='object'&&x!==null)?JSON.stringify(x):String(x);}catch(e){return String(x);}}).join(' ');}" +
        "function send(t,a){try{parent.postMessage({phConsole:true,type:t,text:fmt(a)},'*');}catch(e){}}" +
        "['log','info','warn','error'].forEach(function(m){var o=console[m];console[m]=function(){send(m,arguments);try{o.apply(console,arguments);}catch(e){}};});" +
        "window.addEventListener('error',function(e){send('error',[e.message]);});" +
        "window.addEventListener('unhandledrejection',function(e){send('error',['Promise: '+(e.reason&&e.reason.message||e.reason)]);});" +
        "})();";

    function buildDocument(extraScript, clean, noScripts) {

        // Защита: закрывающий тег скрипта в пользовательском JS не должен ломать страницу
        const safeJs = getCode("javascript").replace(
            new RegExp("<" + "/script", "gi"),
            "<" + "\\/" + "script"
        );

        const parts = [
            "<!DOCTYPE html>",
            '<html lang="ru">',
            "<head>",
            '<meta charset="UTF-8">',
            "<style>",
            getCode("css"),
            "<\/style>",
            "<\/head>",
            "<body>",
            getCode("html")
        ];

        if (!clean) {
            parts.push("<" + "script>", CONSOLE_HOOK, "<" + "/script>");
        }

        if (!noScripts) {
            parts.push("<" + "script>", safeJs, "<" + "/script>");
        }

        if (extraScript && !noScripts) {
            parts.push("<" + "script>", extraScript, "<" + "/script>");
        }

        parts.push("<\/body>", "<\/html>");

        return parts.join("\n");
    }

    function runCode() {
        if (!editor) return;
        clearConsole();
        preview.srcdoc = buildDocument(null, false);
    }

    function scheduleRun() {
        if (!settings.autorun) return;
        clearTimeout(autoTimer);
        autoTimer = setTimeout(function () {
            if (jsCheckHandler) return;
            runCode();
        }, 700);
    }


    // ------------------------------------------------------------
    //  Проверка заданий
    // ------------------------------------------------------------

    function buildHarness(checks) {

        var tests = "[" + checks.map(function (c) {
            return "[" + JSON.stringify(c[0]) + "," + c[1].toString() + (c[2] ? "," + c[2].toString() : "") + "]";
        }).join(",") + "]";

        return "(function(){" +
            "var tests=" + tests + ";" +
            "var res=[];" +
            "for(var i=0;i<tests.length;i++){" +
                "var ok=false;var got;" +
                "try{ok=!!tests[i][1]();}catch(e){ok=false;}" +
                "if(!ok&&tests[i][2]){try{got=tests[i][2]();}catch(e){got='ошибка в коде';}}" +
                "res.push([tests[i][0],ok,got]);" +
            "}" +
            "parent.postMessage({phCheck:true,results:res},'*');" +
        "})();";
    }

    function checkTask() {

        if (!editor) return;

        if (!currentTask) {
            toast("Сейчас свободный режим. Выбери задание в квестах слева, чтобы проверить решение.", false);
            return;
        }

        var q = QUESTS[currentTrack];
        var checks = currentTask.checks;
        var taskType = currentTask.type || q.type;

        clearTimeout(autoTimer);
        setPanelTab("check");
        showPanel(true);
        setCheckMessage("Проверяем…");

        if (taskType === "script") {

            // JavaScript: проверка выполняется внутри страницы результата
            clearConsole();
            if (jsCheckTimer) clearTimeout(jsCheckTimer);

            jsCheckHandler = function (results) {
                clearTimeout(jsCheckTimer);
                jsCheckHandler = null;
                showResult(results, false);
                runCode();
            };

            jsCheckTimer = setTimeout(function () {
                jsCheckHandler = null;
                showResult(checks.map(function (c) { return [c[0], false]; }), true);
                runCode();
            }, 2500);

            preview.srcdoc = buildDocument(buildHarness(checks), false);

        } else {

            // HTML и CSS: проверка в скрытом iframe
            runCode();

            var frame = document.createElement("iframe");
            frame.setAttribute("sandbox", "allow-same-origin");
            frame.className = "checker";

            frame.onload = function () {
                var doc = frame.contentDocument;
                var results = checks.map(function (c) {
                    var ok = false;
                    try { ok = !!c[1](doc); } catch (e) { ok = false; }
                    return [c[0], ok];
                });
                frame.remove();
                showResult(results, false);
            };

            // srcdoc задаём ДО добавления на страницу, иначе onload сработает
            // на пустом документе about:blank и проверка пройдёт по пустой странице
            frame.srcdoc = buildDocument(null, true, true);
            document.body.appendChild(frame);
        }
    }

    function showResult(results, crashed) {

        var box = $("p_check");
        box.innerHTML = "";

        var total = results.length;
        var passed = results.filter(function (r) { return r[1]; }).length;
        var allOk = passed === total;

        var title = document.createElement("div");
        title.className = "res-title " + (allOk ? "ok" : "fail");

        if (allOk) {
            title.textContent = "🎉 Отлично! Задание выполнено! (" + passed + " из " + total + ")";
        } else if (crashed) {
            title.textContent = "Код не запустился. Проверь, нет ли опечаток и лишних скобок.";
        } else {
            title.textContent = "Пока не всё получилось: " + passed + " из " + total;
        }

        box.appendChild(title);

        var list = document.createElement("div");
        list.className = "res-list";

        results.forEach(function (r) {
            var line = document.createElement("div");
            line.className = r[1] ? "ok" : "bad";
            line.textContent = (r[1] ? "✓ " : "✗ ") + r[0] + (!r[1] && r[2] !== undefined ? "   (твой ответ: " + r[2] + ")" : "");
            list.appendChild(line);
        });

        box.appendChild(list);

        if (!allOk) {
            var tip = document.createElement("div");
            tip.className = "p-empty";
            tip.style.marginTop = "6px";
            tip.textContent = "Застрял? Нажми «💡 Подсказка» над редактором.";
            box.appendChild(tip);
            return;
        }

        var isNew = markDone(currentTrack, currentIdx);
        var gain = PHStats.onTaskDone(currentTrack, isNew, currentDaily);
        renderQuests();
        updateStatsBar();
        announceGain(gain);

        var q = QUESTS[currentTrack];
        var hasNext = currentIdx + 1 < q.tasks.length;
        var track = currentTrack;
        var idx = currentIdx;

        var next = document.createElement("button");
        next.className = "next-btn";

        if (examMode) {
            examOnPass();
            var lastOne = exam.current >= exam.picks.length - 1;
            next.textContent = lastOne ? "Завершить экзамен" : "Следующая задача →";
            next.onclick = examNext;
            box.appendChild(next);
            return;
        }

        if (hasNext) {
            next.textContent = "Следующее задание →";
            next.onclick = function () { openTask(track, idx + 1); };
            toast("Задание выполнено! 🎉", true, "Следующее задание →", function () { openTask(track, idx + 1); });
        } else {
            next.textContent = "🏆 Квест «" + q.title + "» пройден! Выбери другой в списке слева";
            next.onclick = function () { showSidebar(); };
            toast("🏆 Квест «" + q.title + "» пройден!", true);
        }

        box.appendChild(next);
    }

    window.addEventListener("message", function (e) {

        if (e.source !== preview.contentWindow || !e.data) return;

        if (e.data.phCheck) {
            if (jsCheckHandler) jsCheckHandler(e.data.results);
        } else if (e.data.phConsole) {
            addConsole(e.data.type, e.data.text);
        }

    });

        var box = $("questSection");
        box.hidden = !box.hidden;
        $("chevQuests").textContent = box.hidden ? "▸" : "▾";
    };

    $("tbHead").onclick = function () {
        var b = $("taskBanner");
        b.classList.toggle("collapsed");
        $("tbChev").textContent = b.classList.contains("collapsed") ? "▸" : "▾";
    };

    $("tbHintBtn").onclick = function (e) { e.stopPropagation(); toggleHint(); };
    $("tbResetBtn").onclick = function (e) { e.stopPropagation(); resetTask(); };
    $("tbBugBtn").onclick = function (e) { e.stopPropagation(); reportBug(); };

    $("pt_problems").onclick = function () { setPanelTab("problems"); };
    $("pt_check").onclick = function () { setPanelTab("check"); };
    $("pt_console").onclick = function () { setPanelTab("console"); };
    $("btnClearConsole").onclick = clearConsole;
    $("btnClosePanel").onclick = function () { showPanel(false); };

    $("sbQuests").onclick = $("actQuests").onclick;
    $("sbProblems").onclick = function () { showPanel(true); setPanelTab("problems"); };
    $("sbAuto").onclick = toggleAutorun;

    if (window.innerWidth <= 800) {
        $("sidebar").hidden = true;
        $("rzSidebar").hidden = true;
        $("actExplorer").classList.remove("active");
    }


    // ------------------------------------------------------------
    //  Подключение Monaco Editor
    // ------------------------------------------------------------

    const MONACO_BASE = "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min";

    window.MonacoEnvironment = {
        getWorkerUrl: function () {
            const code =
                "self.MonacoEnvironment = { baseUrl: '" + MONACO_BASE + "/' };" +
                "importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');";
            return "data:text/javascript;charset=utf-8," + encodeURIComponent(code);
        }
    };

    require.config({
        paths: { vs: MONACO_BASE + "/vs" }
    });

    require(["vs/editor/editor.main"], function () {

        models.html = monaco.editor.createModel("", "html");
        models.css = monaco.editor.createModel("", "css");
        models.javascript = monaco.editor.createModel("", "javascript");

        editor = monaco.editor.create(
            $("editor"),
            {
                model: models.html,
                theme: settings.theme === "light" ? "vs" : "vs-dark",
                automaticLayout: true,
                fontSize: settings.fontSize,
                fontFamily: "Consolas, 'Courier New', monospace",
                minimap: { enabled: false },
                tabSize: 4,
                wordWrap: settings.wrap ? "on" : "off",
                scrollBeyondLastLine: false,
                renderWhitespace: "selection",
                bracketPairColorization: { enabled: true },
                smoothScrolling: true,
                cursorBlinking: "smooth",
                padding: { top: 8 },
                quickSuggestions: { other: true, comments: false, strings: true },
                suggest: { showWords: false, snippetsPreventQuickSuggestions: false },
                snippetSuggestions: "top",
                tabCompletion: "on",
                acceptSuggestionOnEnter: "on",
                suggestSelection: "first"
            }
        );

        try {
            monaco.languages.typescript.javascriptDefaults.setDiagnosticsOptions({
                noSemanticValidation: true,
                noSyntaxValidation: false
            });
        } catch (err) { /* настройка недоступна в этой версии */ }

        Object.keys(models).forEach(function (k) {
            models[k].onDidChangeContent(function () {
                scheduleRun();
                scheduleSaveFree();
            });
        });

        editor.onDidChangeCursorPosition(function (e) {
            $("sbPos").textContent = "Стр " + e.position.lineNumber + ", стлб " + e.position.column;
        });

        monaco.editor.onDidChangeMarkers(refreshProblems);


        // Emmet: подсказки и раскрытие по Tab / Enter, как в VS Code
        monaco.languages.registerCompletionItemProvider(
            "html",
            emmetProvider("html", ["!", ".", "#", ">", "+", "*", "^", "(", ")", "[", "]", "{", "}", "$", "@", ":", "-", "=", "/"])
        );

        monaco.languages.registerCompletionItemProvider(
            "css",
            emmetProvider("css", ["#", ".", "%", "!", "-", "+"])
        );

        // Tab без списка подсказок: раскрываем сокращение перед курсором,
        // а если сокращения нет, Tab работает как обычный отступ
        editor.addCommand(
            monaco.KeyCode.Tab,
            function () {

                var sel = editor.getSelection();

                if ((activeFile === "html" || activeFile === "css") && !(sel && !sel.isEmpty())) {
                    var ctx = emmetContext(editor.getModel(), editor.getPosition(), activeFile);
                    if (ctx) {
                        emmetInsert(ctx);
                        return;
                    }
                }

                editor.trigger("keyboard", "tab", null);

            },
            "!suggestWidgetVisible && !inSnippetMode && !editorHasSelection"
        );


        // Горячие клавиши и команды в палитре (F1)
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveAll);
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runCode);
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyB, toggleSidebar);
        editor.addCommand(
            monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyP,
            function () { editor.trigger("keyboard", "editor.action.quickCommand", null); }
        );

        editor.addAction({ id: "ph.run", label: "Programer Help: Запустить код", run: runCode });
        editor.addAction({ id: "ph.check", label: "Programer Help: Проверить задание", run: checkTask });
        editor.addAction({ id: "ph.hint", label: "Programer Help: Показать подсказку", run: toggleHint });
        editor.addAction({ id: "ph.theme", label: "Programer Help: Сменить тему", run: toggleTheme });


        // Что открыть при загрузке страницы
        // (старые ссылки ?lesson=1/2/3 тоже работают)
        let track = params.get("track");
        let taskNumber = parseInt(params.get("task") || "1", 10);
        const lesson = params.get("lesson");

        if (lesson === "1") { track = "html"; taskNumber = 1; }
        if (lesson === "2") { track = "css"; taskNumber = 1; }
        if (lesson === "3") { track = "js"; taskNumber = 1; }

        if (params.get("exam")) {
            openFree(false);
            startExam();
        } else if (params.get("daily")) {
            openDaily();
        } else if (params.get("code")) {
            openShared(params.get("code"), params.get("tab"));
        } else if (track && QUESTS[track]) {
            openTask(track, Math.max(0, taskNumber - 1));
        } else {
            openFree(false);
        }

        refreshProblems();

    });

</script>


<script src="translations.js"></script>
</body>
</html>
