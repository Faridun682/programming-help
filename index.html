<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="X02ASrcW-cVk6fWoJjvaOy2CSp8tQbbiiI6NOfSpG-k">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Site</title>
    <link rel="icon" type="image/png" href="./image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2rem;
            background-color: #ffffff;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #e2e8f0;
        }

        .site-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.02em;
        }

        .nav-menu {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            text-decoration: none;
            color: #64748b;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease, transform 0.2s ease;
            position: relative;
            padding: 4px 0;
        }

        .nav-link:hover {
            color: #2563eb;
        }

        .nav-link.active {
            color: #2563eb;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #2563eb;
            border-radius: 2px;
        }

        .hero-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 4rem;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hero-badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.15;
            color: #0f172a;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        .hero-subtitle {
            font-size: 1.125rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }

        .hero-image-box {
            width: 100%;
        }

        .hero-placeholder-img {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .hero-placeholder-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid #ffffff;
            border-radius: 16px;
        }

        @media (max-width: 1000px) {
            .site-header {
                flex-wrap: wrap;
                gap: 12px;
            }

            .nav-menu {
                gap: 16px;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 968px) {
            .hero-section {
                grid-template-columns: 1fr;
                text-align: center;
                margin: 2rem auto;
                gap: 2.5rem;
            }

            .hero-content {
                align-items: center;
            }

            .hero-badge {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-title {
                font-size: 2.25rem;
            }

            .hero-actions {
                justify-content: center;
            }

            .hero-placeholder-img {
                height: 300px;
            }
        }

        @media (max-width: 640px) {
            .site-header {
                flex-direction: column;
                gap: 16px;
                padding: 1rem;
                text-align: center;
            }

            .logo-area {
                flex-direction: column;
                gap: 8px;
            }

            .nav-menu {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="logo-area">
            <img class="logo-img" src="./image.png" alt="Logo">
            <h1 class="site-title">My Web site</h1>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link active">Главная</a>
            <a href="lessons.html" class="nav-link">Уроки</a>
            <a href="cheatsheet.html" class="nav-link">Шпаргалка</a>
            <a href="ai.html" class="nav-link">Programer AI</a>
            <a href="about.html" class="nav-link">О сайте</a>
            <a href="help.html" class="nav-link">Помощь</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
        </nav>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <span class="hero-badge">Добро пожаловать</span>
            <h2 class="hero-title">Создавайте современные и быстрые сайты вместе с нами</h2>
            <p class="hero-subtitle">Здесь вы найдете полезные статьи, инструменты и руководства для веб-разработки. Начните свой путь прямо сейчас.</p>
            <div class="hero-actions">
                <a href="lessons.html" class="btn btn-primary">Узнать больше</a>
                <a href="contacts.html" class="btn btn-secondary">Связаться</a>
            </div>
        </div>
        <div class="hero-image-box">
            <div class="hero-placeholder-img"><img src="./image copy.png" alt="Код на экране"></div>
        </div>
    </section>


<script src="translations.js"></script>
</body>
</html>
